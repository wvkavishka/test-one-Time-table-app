<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CampusFlow — School Management OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@500;700;800&family=Noto+Sans+Tamil:wght@500;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="styles/shell.css">
</head>

<body class="text-zinc-900 antialiased">
<style id="print-page-style">@page { size: A4 landscape; margin: 10mm; }</style>

<div id="splash">
  <div class="relative flex flex-col items-center px-8">
    <div class="brand-pop splash-ring mb-6"><i class="ph-fill ph-graduation-cap text-5xl" style="color:#fff"></i></div>
    <div class="brand-pop font-display font-bold text-3xl tracking-tight text-white">CampusFlow</div>
    <div class="brand-pop text-[13px] font-medium text-teal-200/80 mt-1.5 text-center" style="animation-delay:.12s">Your school, beautifully orchestrated</div>
    <div class="splash-bar mt-7" role="progressbar" aria-label="Loading CampusFlow"></div>
    <div id="splash-step" class="splash-step text-[12px] font-semibold text-teal-200/90 mt-3.5">Opening your workspace…</div>
  </div>
</div>

<div id="login-root" hidden></div>

<div id="app" hidden>
  <aside id="sidebar" class="hidden lg:flex flex-col fixed inset-y-0 left-0 w-[264px] bg-white/85 backdrop-blur-xl border-r border-zinc-200/80 z-40">
    <div class="flex items-center gap-3 px-5 pt-6 pb-5">
      <div id="brand-tile" class="tile w-11 h-11 bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-lg shadow-emerald-600/25 rounded-2xl overflow-hidden">
        <i class="ph-fill ph-graduation-cap text-2xl"></i>
      </div>
      <div class="min-w-0">
        <div class="font-display font-bold text-[15px] tracking-tight leading-tight">CampusFlow</div>
        <div id="sidebar-school" class="text-[11px] text-zinc-500 truncate font-medium">School OS</div>
      </div>
    </div>
    <nav id="side-nav" class="px-3 space-y-1 flex-1 overflow-y-auto"></nav>
    <div class="p-4">
      <div id="sidebar-footnote"></div>
      <div class="text-[10px] text-zinc-400 text-center mt-3 font-medium">CampusFlow v3.0 · Production</div>
    </div>
  </aside>

  <div class="lg:pl-[264px] min-h-dvh flex flex-col">
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-zinc-200/70">
      <div class="flex items-start gap-2 px-3 sm:px-6 lg:min-h-[68px] lg:items-center lg:h-[68px] py-2.5 lg:py-0 max-w-[1400px] mx-auto w-full">
        <div class="tile w-10 h-10 lg:hidden bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-xl overflow-hidden flex-none self-start lg:hidden" id="brand-tile-m">
          <i class="ph-fill ph-graduation-cap text-xl"></i>
        </div>
        <div id="hdr-name-wrap" class="min-w-0 flex-1 lg:ml-1">
          <h1 id="hdr-title" class="font-display font-bold tracking-tight leading-[1.15] text-[16px] sm:text-[18px] lg:text-[17px]">Dashboard</h1>
          <div id="hdr-sub" class="text-[11px] text-zinc-500 font-medium leading-snug mt-0.5">—</div>
        </div>
        <div class="flex items-center gap-1 flex-none self-start">
          <div id="hdr-conflict"></div>
          <button id="hdr-undo" class="icon-btn !w-10 !h-10 opacity-40 pointer-events-none" data-action="undo" aria-label="Undo last change" title="Undo (Ctrl+Z)"><i class="ph ph-arrow-counter-clockwise text-lg"></i></button>
          <button id="hdr-redo" class="icon-btn !w-10 !h-10 opacity-40 pointer-events-none hidden sm:inline-flex" data-action="redo" aria-label="Redo change" title="Redo (Ctrl+Shift+Z)"><i class="ph ph-arrow-clockwise text-lg"></i></button>
          <div id="sync-pill" class="hidden sm:block"></div>
          <div id="hdr-actions" class="hidden sm:flex items-center gap-1">
            <button id="hdr-print" class="icon-btn !w-10 !h-10" data-action="nav" data-route="print" aria-label="Print center" title="Print center"><i class="ph ph-printer text-lg"></i></button>
            <button id="hdr-account" class="icon-btn !w-10 !h-10" data-action="my-account" aria-label="My account" title="My account · change password"><i class="ph ph-user-circle text-lg"></i></button>
            <button class="icon-btn !w-10 !h-10" data-action="sign-out" aria-label="Sign out" title="Sign out"><i class="ph ph-sign-out text-lg"></i></button>
          </div>
          <button id="hdr-menu" class="sm:hidden flex items-center justify-center flex-none w-12 h-12 rounded-xl text-white transition-all active:scale-95" style="background:linear-gradient(135deg,#059669,#0d9488);box-shadow:0 1px 3px rgba(5,150,105,.35),inset 0 1px 0 rgba(255,255,255,.18)" data-action="header-menu" aria-label="More options" aria-haspopup="menu" aria-expanded="false"><i class="ph-fill ph-dots-three-vertical-bold text-xl"></i></button>
        </div>
      </div>
    </header>
    <main id="view" class="flex-1 w-full max-w-[1400px] mx-auto px-4 sm:px-6 pt-5 sm:pt-7 pb-32 lg:pb-12"></main>
  </div>

  <nav id="tabbar" class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white/85 backdrop-blur-xl border-t border-zinc-200/80" style="padding-bottom: env(safe-area-inset-bottom)">
    <div id="tabbar-grid" class="grid max-w-md mx-auto"></div>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>
<input type="file" id="import-file" accept="application/json,.json,.xlsx,.xlsm,.xls,.csv,.tsv,.ods,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" data-change="import-file">
<input type="file" id="logo-file" accept="image/*" class="hidden" data-change="logo-file">
<input type="file" id="scan-cam" accept="image/*" capture="environment" class="hidden" data-change="scan-file">
<input type="file" id="scan-lib" accept="image/*,application/pdf,.pdf,.xlsx,.xlsm,.xls,.csv,.tsv,.ods,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" data-change="scan-file">

<script src="app.js"></script>
</body>
</html>
